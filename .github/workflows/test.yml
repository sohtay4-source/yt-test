name: Test YouTube Download

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  test-download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install yt-dlp
        run: pip install yt-dlp
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Test yt-dlp with cookies
        run: |
          echo "=== GitHub Actions IP ==="
          curl -s ifconfig.me
          echo ""
          echo ""
          
          echo "=== Testing yt-dlp ==="
          yt-dlp --cookies cookies.txt --dump-json --no-download "https://youtu.be/d9n6cRNhFSc" 2>&1 | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              print(f'Title: {data.get(\"title\", \"N/A\")}')
              print(f'Duration: {data.get(\"duration\", \"N/A\")} seconds')
              print(f'Formats: {len(data.get(\"formats\", []))}')
              print('SUCCESS!')
          except:
              print('JSON parse failed')
          "
          
          echo ""
          echo "=== List formats ==="
          yt-dlp --cookies cookies.txt --list-formats "https://youtu.be/d9n6cRNhFSc" 2>&1 | tail -15
