          import sys, json
          try:
              data = json.load(sys.stdin)
              print(f'Title: {data.get(\"title\", \"N/A\")}')
              print(f'Duration: {data.get(\"duration\", \"N/A\")} seconds')
              print(f'Formats: {len(data.get(\"formats\", []))}')
